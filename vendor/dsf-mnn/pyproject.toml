[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsf-mnn"
version = "1.2.0"
description = "Evidence-preserving associative memory research core for DSF"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
dreaming = ["tokenizers>=0.21,<1", "jinja2>=3.1,<4"]
test = ["pytest>=7,<10"]

[project.scripts]
mnn = "dsf_mnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsf_mnn = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
